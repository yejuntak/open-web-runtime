<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body{font:13px system-ui,sans-serif;width:320px;margin:0;padding:16px;background:#111;color:#eee}
h1{font-size:15px;margin:0 0 12px}label{display:block;margin:10px 0 4px;color:#aaa}
input{width:100%;box-sizing:border-box;padding:8px;background:#1d1d1d;color:#fff;border:1px solid #333;border-radius:6px}
button{margin-top:10px;width:100%;padding:9px;border:0;border-radius:6px;background:#eee;color:#111;font-weight:600}
button.secondary{background:#2b2b2b;color:#eee}button.audio{background:#d8e7ff;color:#10213a}
#status,#audioStatus{margin-top:9px;color:#aaa;line-height:1.4}
small{display:block;margin-top:10px;color:#777;line-height:1.4}
hr{border:0;border-top:1px solid #2a2a2a;margin:14px 0}
</style>
</head>
<body>
<h1>OWR Shared Tab</h1>
<label>Bridge</label>
<input id="bridge" value="ws://127.0.0.1:8790/bridge">
<label>Pairing token</label>
<input id="token" type="password" autocomplete="off" placeholder="Paste token printed by OWR">
<button id="share">Share current tab</button>
<button id="stop" class="secondary">Stop sharing</button>
<div id="status">Nothing is shared.</div>
<hr>
<button id="enableAudio" class="audio">Enable audio for shared tab (optional)</button>
<button id="disableAudio" class="secondary">Disable audio</button>
<div id="audioStatus">Audio capture is off.</div>
<small>Visual sharing uses only temporary activeTab access. Audio is optional and asks for Chrome's tabCapture/offscreen permissions only when you click Enable audio. Navigation revokes the share.</small>
<script src="popup.js"></script>
</body>
</html>
