name: Public Video Compatibility Probe
on:
  push:
    branches: [audit/video-readiness]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-video-probe
  cancel-in-progress: true
jobs:
  public-video:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node scripts/public-video-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-video-${{ github.sha }}
          path: test-results/public-video/
          if-no-files-found: error
