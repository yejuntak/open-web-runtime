name: Publish Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}"
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Expose smoke image
        id: image
        run: echo "value=${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  container-smoke:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull "${{ needs.publish.outputs.image }}"

      - name: Start no-key MCP container
        run: |
          docker run -d --name owr-smoke             -p 8787:8787             --shm-size=1g             -e HOST=0.0.0.0             -e PORT=8787             -e LLM_API_KEY=             -e HEADLESS=true             -e ALLOW_PRIVATE_NETWORKS=false             "${{ needs.publish.outputs.image }}"

      - name: Wait for health
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs owr-smoke
          exit 1

      - name: Verify MCP endpoint responds
        run: |
          curl -sS -o /tmp/mcp.out -w "%{http_code}"             -X POST http://127.0.0.1:8787/mcp             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"container-smoke","version":"1.0.0"}}}'             | tee /tmp/mcp.status
          grep -Eq '^(200|202)$' /tmp/mcp.status
          grep -q '"jsonrpc"' /tmp/mcp.out

      - name: Container logs on failure
        if: failure()
        run: docker logs owr-smoke || true
