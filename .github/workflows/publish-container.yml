name: Publish Container
on:
  push:
    branches: [main, audit/video-readiness]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packaged-runtime-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build exact candidate image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start candidate without model keys or external network
        run: >-
          docker run -d --name owr-smoke --network none --shm-size=1g
          -e HOST=0.0.0.0 -e PORT=8787 -e MCP_ONLY=true -e LLM_API_KEY=
          -e OPENAI_API_KEY= -e HEADLESS=true -e ALLOW_PRIVATE_NETWORKS=false
          "${IMAGE_NAME}:sha-${GITHUB_SHA}"
      - name: Exercise actual packaged Chromium through MCP
        run: docker exec -i owr-smoke node --input-type=module < scripts/container-mcp-smoke.mjs
      - name: Log in only after package acceptance
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "$image"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker tag "$image" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"
          else
            docker tag "$image" "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            docker push "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
      - name: Logs on failure
        if: failure()
        run: docker logs owr-smoke || true
      - name: Cleanup
        if: always()
        run: docker rm -f owr-smoke || true
